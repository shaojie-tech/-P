name: Android APK

# APK 构建：
# - 手动触发（Actions 页面 Run workflow，可指定内置服务器地址）→ 下载 artifact；
# - 推送 v* 标签 → 构建并把 APK 附到对应 GitHub Release（与 release.yml 协同）。

on:
  workflow_dispatch:
    inputs:
      server_base:
        description: "内置默认服务器地址（如 https://api.example.com，留空则由用户在登录页填写）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: frontend/android/**/*.gradle*

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web assets
        working-directory: frontend
        env:
          VITE_SERVER_BASE: ${{ inputs.server_base }}
        run: npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        working-directory: frontend/android
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          cp app/build/outputs/apk/debug/app-debug.apk "xiaop-interview-${TAG}-debug.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: frontend/android/xiaop-interview-*.apk

      - name: Attach APK to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: frontend/android
        run: |
          TAG="$GITHUB_REF_NAME"
          # release.yml 与本 workflow 由同一 tag 触发，Release 可能尚未创建，兜底自建
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" "xiaop-interview-${TAG}-debug.apk" --clobber
